# Render infrastructure for Codimente Private AI.
# Deploy: create a new "Blueprint" in Render and point it
# at this repository, or commit this file and Render will
# detect it when you create services manually.
#
# The PostgreSQL database is NOT provisioned here: the
# account's single free-tier database slot is reserved for
# another project, so the demo uses an external managed
# Postgres (Tiger Cloud) whose connection string is pasted
# into DATABASE_URL manually (sync: false).

services:
  - type: web
    name: codimente-ai
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true

    # Render restarts the service automatically when this
    # endpoint stops answering with HTTP 200.

    healthCheckPath: /health/

    buildCommand: "./build.sh"

    # One gunicorn worker (with threads): the embedding
    # model load puts each worker near a small instance's
    # memory limit, so scaling out workers is how this
    # demo runs out of memory. The processing worker runs
    # in-process and a demo has few concurrent users — a
    # single worker is the right shape.

    startCommand: "gunicorn codimente_ai.wsgi:application --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT"

    # Demo-sized persistent disk: uploaded knowledge
    # documents survive deploys and restarts. Demo only —
    # client deployments run on-premises instead.

    disk:
      name: codimente-ai-media
      mountPath: /opt/app/media
      sizeGB: 1

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"

      - key: DJANGO_SETTINGS_MODULE
        value: "codimente_ai.settings"

      - key: DEBUG
        value: "False"

      # External managed Postgres connection string
      # (Tiger Cloud). Pasted once in the dashboard; the
      # host is external, so settings.py applies
      # sslmode=require automatically.

      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: ALLOWED_HOSTS
        value: "ai.codimentesystems.com,.onrender.com"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://ai.codimentesystems.com"

      - key: HF_TOKEN
        sync: false

      - key: AI_MODEL
        sync: false

      # Password for the organisation admin created by
      # the seed_organisation build step (username: admin).

      - key: SEED_ADMIN_PASSWORD
        sync: false

      # Uploaded knowledge documents live on the
      # persistent disk mounted at /opt/app/media.

      - key: MEDIA_ROOT
        value: /opt/app/media
