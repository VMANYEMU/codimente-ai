# Render infrastructure for Codimente Private AI.
# Deploy: create a new "Blueprint" in Render and point it
# at this repository, or commit this file and Render will
# detect it when you create services manually.

databases:
  - name: codimente-ai-db
    databaseName: codimente_ai
    user: codimente
    plan: basic-256mb

    # MUST match the web service region: Render's internal
    # database hostname only resolves within the same
    # region. This database already exists in oregon (the
    # account's other database blocks a second free/256mb
    # instance), so the web service is pinned here too.

    region: oregon
    postgresMajorVersion: 17
    # pgvector is available on Render PostgreSQL by
    # default; the migration enables the extension.

services:
  - type: web
    name: codimente-ai
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true

    # Render restarts the service automatically when this
    # endpoint stops answering with HTTP 200.

    healthCheckPath: /health/

    buildCommand: "./build.sh"
    startCommand: "gunicorn codimente_ai.wsgi:application --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT"

    # Demo-sized persistent disk: uploaded knowledge
    # documents survive deploys and restarts. Demo only —
    # client deployments run on-premises instead.

    disk:
      name: codimente-ai-media
      mountPath: /opt/app/media
      sizeGB: 1

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"

      - key: DJANGO_SETTINGS_MODULE
        value: "codimente_ai.settings"

      - key: DEBUG
        value: "False"

      # Blueprint web services do NOT receive DATABASE_URL
      # automatically: the connection must be declared
      # explicitly.

      - key: DATABASE_URL
        fromDatabase:
          name: codimente-ai-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: ALLOWED_HOSTS
        value: "ai.codimentesystems.com,.onrender.com"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://ai.codimentesystems.com"

      - key: HF_TOKEN
        sync: false

      - key: AI_MODEL
        sync: false

      # Password for the organisation admin created by
      # the seed_organisation build step (username: admin).

      - key: SEED_ADMIN_PASSWORD
        sync: false

      # Uploaded knowledge documents live on the
      # persistent disk mounted at /opt/app/media.

      - key: MEDIA_ROOT
        value: /opt/app/media
